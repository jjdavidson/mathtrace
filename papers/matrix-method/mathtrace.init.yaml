format: mathtrace-initialization
version: 1

graph:
  nodeDirectory: nodes

# Author-selected default layout.
layout:
  engine: elk
  algorithm: layered
  direction: DOWN
  nodePlacementStrategy: NETWORK_SIMPLEX

# Safety rules for initial and user-created bundles.
bundling:
  removeInternalEdges: true
  deduplicateExternalEdges: true
  rejectOverlappingBundles: true
  rejectCyclesAfterBundling: true

bundles:
  - id: bundle.matrix-invariants
    title: Matrix invariants
    representative: sacg.invariance.matrix-invariants
    collapsed: true
    members:
      - sacg.invariance.column-permutation
      - sacg.invariance.column-negation
      - sacg.invariance.column-addition
      - sacg.invariance.dependent-column-deletion
      - sacg.invariance.matrix-invariants

  - id: bundle.matrix-isomorphisms
    title: Matrix isomorphisms
    representative: sacg.isomorphisms.matrix-isomorphisms
    collapsed: true
    members:
      - sacg.isomorphisms.row-permutation
      - sacg.isomorphisms.row-negation
      - sacg.isomorphisms.block-diagonal-box-product
      - sacg.isomorphisms.matrix-isomorphisms

  - id: bundle.matrix-homomorphisms
    title: Matrix homomorphisms
    representative: sacg.homomorphisms.matrix-homomorphisms
    collapsed: true
    members:
      - sacg.homomorphisms.criterion
      - sacg.homomorphisms.column-factor-reduction
      - sacg.homomorphisms.row-sum
      - sacg.homomorphisms.column-append
      - sacg.homomorphisms.zero-row-append
      - sacg.homomorphisms.matrix-homomorphisms

  - id: bundle.heuberger-matrix-model
    title: Heuberger matrix model
    representative: sacg.heuberger-matrix
    collapsed: true
    members:
      - sacg.standardized-abelian-cayley-graph
      - sacg.heuberger-matrix
      - sacg.matrix-realization

  - id: bundle.standardization
    title: Standardization
    representative: sacg.standardization-isomorphism
    collapsed: true
    members:
      - sacg.standardization
      - sacg.standardization-isomorphism

  - id: bundle.cartesian-products
    title: Cartesian products
    representative: graph.cartesian-product-chromatic-number
    collapsed: true
    members:
      - graph.cartesian-product
      - graph.cartesian-product-chromatic-number

  - id: bundle.integer-distance-graphs
    title: Integer-distance graphs
    representative: cayley.integer-distance-heuberger-matrix
    collapsed: true
    members:
      - cayley.integer-distance-graph
      - cayley.integer-distance-heuberger-matrix
      - cayley.examples.integer-distance
      - cayley.examples.zhu-6-10-25

  - id: bundle.circulant-graphs
    title: Circulant graphs
    representative: cayley.circulant-heuberger-matrix
    collapsed: true
    members:
      - cayley.circulant-graph
      - cayley.circulant-heuberger-matrix
      - cayley.examples.heuberger-circulant-35

  - id: bundle.cube-like-graphs
    title: Cube-like graphs
    representative: cayley.payan-theorem
    collapsed: true
    members:
      - cayley.cube-like-graphs
      - cayley.sokolova-theorem
      - cayley.folded-cube-source-homomorphism
      - cayley.payan-theorem
